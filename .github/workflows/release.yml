name: Release skill archive

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            activation-gateway/package-lock.json
            realvoice-relay/package-lock.json

      - name: Install gateway dependencies
        run: npm ci --prefix activation-gateway

      - name: Install wallet activation client dependencies
        run: npm ci --prefix realvoice-relay

      - name: Verify release candidate
        run: |
          python -m unittest discover -s tests -v
          npm test --prefix activation-gateway
          node --test tests/activation-client.test.mjs
          npm audit --prefix activation-gateway --omit=dev
          npm audit --prefix realvoice-relay --omit=dev

      - name: Build reproducible install archive
        run: |
          rm -f realvoice-relay-skill.zip SHA256SUMS.txt
          python tools/build_skill_archive.py
          sha256sum realvoice-relay-skill.zip > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          realvoice-relay-skill.zip
          SHA256SUMS.txt
          --generate-notes
